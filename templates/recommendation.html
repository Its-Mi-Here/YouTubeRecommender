<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Recommendations</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Profile Picture Container */
        .profile-container {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            z-index: 100;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            transition: transform 0.3s;
        }

        .profile-pic:hover {
            transform: scale(1.1);
        }

        /* Dropdown Menu */
        .dropdown {
            display: none;
            position: absolute;
            top: 60px;
            right: 0;
            background-color: #333333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            width: 150px;
        }

        .dropdown a {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 12px 15px;
            transition: background-color 0.3s;
        }

        .dropdown a:hover {
            background-color: #555555;
        }

        .show {
            display: block;
        }

        /* Recommendations List */
        .recommendations-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            padding: 20px;
            border-radius: 12px;
            background-color: #1e1e1e;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        .recommendation-item {
            display: flex;
            align-items: center;
            margin: 20px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .recommendation-item:last-child {
            border-bottom: none;
        }

        .thumbnail {
            width: 150px;
            height: 90px;
            border-radius: 10px;
            margin-right: 20px;
            transition: transform 0.3s;
        }

        .thumbnail:hover {
            transform: scale(1.05);
        }

        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-info a {
            color: #00aaff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        .video-info a:hover {
            color: #66c2ff;
            text-decoration: underline;
        }

        .video-info span {
            font-size: 14px;
            color: #bbbbbb;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .thumbnail {
                width: 100px;
                height: 60px;
            }

            .video-info a {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Profile Picture with Dropdown -->
    <div class="profile-container" onclick="toggleDropdown()">
        <img src="{{ user['picture'] }}" alt="Profile Picture" class="profile-pic">
        <div class="dropdown" id="profile-dropdown">
            <a> {{ user['given_name'] }} {{user['family_name']}} </a>
            <a href="/logout">Log Out</a>
        </div>
    </div>

    <!-- Recommendations List -->
    <div class="recommendations-container">
        {% for index, title, link, channel, thumbnail in recommendations %}
            <div class="recommendation-item">
                <a href="{{ link }}" target="_blank">
                    <img class="thumbnail" src="{{ thumbnail }}" alt="Video Thumbnail">
                </a>
                <div class="video-info">
                    <a href="{{ link }}" target="_blank">{{ title }}</a>
                    <span>Channel: {{ channel }}</span>
                </div>
            </div>
        {% endfor %}
    </div>

    <!-- JavaScript for Dropdown Toggle -->
    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById('profile-dropdown');
            dropdown.classList.toggle('show');
        }

        // Close the dropdown if clicked outside
        window.addEventListener('click', function (event) {
            const profileContainer = document.querySelector('.profile-container');
            const dropdown = document.getElementById('profile-dropdown');
            if (!profileContainer.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
    </script>

</body>
</html>
