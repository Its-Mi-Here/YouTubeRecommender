<!DOCTYPE html>
<html>
<head>
    <title>Recommendations based on your friends' likes</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        /* User Header (Top Right) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-left: 10px;
        }

        /* Recommendations List */
        .recommendations-container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .recommendation-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .recommendation-item:last-child {
            border-bottom: none;
        }

        .thumbnail {
            width: 100px;
            height: auto;
            border-radius: 8px;
            margin-right: 15px;
        }

        .video-info {
            display: flex;
            flex-direction: column;
        }

        .video-info a {
            font-size: 16px;
            font-weight: bold;
            color: #0073e6;
            text-decoration: none;
        }

        .video-info a:hover {
            text-decoration: underline;
        }

        .video-info span {
            font-size: 14px;
            color: #555;
        }

        /* Logout Button */
        .google-btn {
            display: inline-block;
            background: #db4437;
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .google-btn:hover {
            background: #c1351d;
        }
    </style>
</head>
<body>

    <!-- Header Section (User Info on Right) -->
    <div class="header">
        <h2>Video Recommendations</h2>
        <div class="user-info">
            <span>Welcome, {{ user['family_name'] }}</span>
            <img src="{{ user['picture'] }}" alt="User Picture">
        </div>
    </div>

    <!-- Recommendations List -->
    <div class="recommendations-container">
        {% for index, title, link, channel, thumbnail in recommendations %}
            <div class="recommendation-item">
                <img class="thumbnail" src="{{ thumbnail }}" alt="Video Thumbnail">
                <div class="video-info">
                    <a href="{{ link }}" target="_blank">{{ index }}. {{ title }}</a>
                    <span>Channel: {{ channel }}</span>
                </div>
            </div>
        {% endfor %}
    </div>

    <!-- Logout Button -->
    <div style="text-align: center; margin-top: 20px;">
        <a href="/logout" class="google-btn">Log out</a>
    </div>

</body>
</html>
