<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="static/icons/YT.png" sizes="192x192" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Recommendations</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 60px;
            height: 100vh;
            background-color: #1c1c1c;
            transition: width 0.3s;
            padding-top: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            position: fixed;
            left: 0;
            top: 0;
            overflow-x: hidden;
            z-index: 100;
        }

        .sidebar.expanded {
            width: 200px;
        }

        .sidebar:hover {
            width: 200px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            padding-top: 60px; /* Add padding to shift down the buttons */
        }

        .sidebar li {
            padding: 20px;
            text-align: center;
            transition: background 0.3s;
        }

        .sidebar li:hover {
            background-color: #333;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            white-space: nowrap;
        }

        .sidebar a span {
            visibility: hidden; /* Hide text when sidebar is collapsed */
        }

        .sidebar.expanded a span,
        .sidebar:hover a span {
            visibility: visible; /* Show text when sidebar is expanded or hovered */
        }

        .sidebar:hover a,
        .sidebar.expanded a {
            text-align: left;
            padding-left: 20px;
        }

        /* Toggle Button Styles */
        .toggle-btn {
            position: absolute;
            top: 20px; /* Changed from bottom: 20px to top: 20px */
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .toggle-btn:hover {
            background-color: #555;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 60px;
            width: 100%;
            padding: 30px;
        }

        .sidebar.expanded + .main-content {
            margin-left: 200px;
        }

        /* Profile Picture Container */
        .profile-container {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            z-index: 100;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            transition: transform 0.3s;
        }

        .profile-pic:hover {
            transform: scale(1.1);
        }

        /* Dropdown Menu */
        .dropdown {
            display: none;
            position: absolute;
            top: 60px;
            right: 0;
            background-color: #333333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            width: 180px;
        }

        .dropdown a {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 12px 15px;
            border-bottom: 1px solid #444;
            transition: background-color 0.3s;
            text-align: center;
        }

        .dropdown a:last-child {
            border-bottom: none;
        }

        .dropdown a:hover {
            background-color: #555555;
        }

        .show {
            display: block;
        }

        /* Recommendations List */
        .recommendations-container {
            max-width: 900px;
            max-height: 80vh; /* Limit height to 80% of the viewport height */
            overflow-y: auto; /* Enable vertical scrolling */
            margin: 80px auto 30px auto;
            padding: 20px;
            border-radius: 12px;
            background-color: #1e1e1e;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }
        /* Custom Scrollbar Styles */
        .recommendations-container::-webkit-scrollbar {
            width: 8px;
        }

        .recommendations-container::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 4px;
        }

        .recommendations-container::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .recommendations-container::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        .recommendation-item {
            display: flex;
            align-items: center;
            margin: 20px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .recommendation-item:last-child {
            border-bottom: none;
        }

        .thumbnail {
            width: 150px;
            height: 90px;
            border-radius: 10px;
            margin-right: 20px;
            transition: transform 0.3s;
        }

        .thumbnail:hover {
            transform: scale(1.05);
        }

        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-info a {
            color: #00aaff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        .video-info a:hover {
            color: #66c2ff;
            text-decoration: underline;
        }

        .video-info span {
            font-size: 14px;
            color: #bbbbbb;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .thumbnail {
                width: 100px;
                height: 60px;
            }

            .video-info a {
                font-size: 16px;
            }

            .sidebar {
                width: 50px;
            }

            .sidebar.expanded {
                width: 150px;
            }

            .sidebar:hover {
                width: 150px;
            }

            .main-content {
                margin-left: 50px;
            }

            .sidebar.expanded + .main-content {
                margin-left: 150px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <ul>
            <li><a href="/analyze">📝 <span>User Analysis</span></a></li>
            <li><a href="/get_youtube_data">📥 <span>Sync data</span></a></li>
            <li><a href="/friends">🧑‍🤝‍🧑 <span>Your Friends</span></a></li>
            <!-- <li><a href="/analyze">📝 <span>Summarize</span></a></li> -->
            <!-- <li><a href="/visualize">📊 <span>Visualize</span></a></li> -->
            <li><a href="/logout">🚪 <span>Logout</span></a></li>
        </ul>
        <!-- Toggle Button Moved to Top -->
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">

        <!-- Profile Picture with Dropdown -->
        <div class="profile-container" onclick="toggleDropdown()">
            <img src="{{ user['picture'] }}" alt="Profile Picture" class="profile-pic">
            <div class="dropdown" id="profile-dropdown">
                <a>{{ user['given_name'] }} {{ user['family_name'] }}</a>
                <a href="/logout">Log Out</a>
            </div>
        </div>

        <!-- Recommendations List -->
        <div class="recommendations-container">
            {% for title, link, channel, thumbnail in recommendations %}
                <div class="recommendation-item">
                    <a href="{{ link }}" target="_blank">
                        <img class="thumbnail" src="{{ thumbnail }}" alt="Video Thumbnail">
                    </a>
                    <div class="video-info">
                        <a href="{{ link }}" target="_blank">{{ title }}</a>
                        <span>Channel: {{ channel }}</span>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- JavaScript for Dropdown Toggle and Sidebar Toggle -->
    <script>
        // Toggle Dropdown
        function toggleDropdown() {
            const dropdown = document.getElementById('profile-dropdown');
            dropdown.classList.toggle('show');
        }

        // Close the dropdown if clicked outside
        window.addEventListener('click', function (event) {
            const profileContainer = document.querySelector('.profile-container');
            const dropdown = document.getElementById('profile-dropdown');
            if (!profileContainer.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        // Toggle Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('expanded');
        }
    </script>

</body>
</html>
