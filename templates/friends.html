<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="text"] {
            padding: 5px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Friends</h1>

    <!-- Search Users Section -->
    <div id="search-users">
        <h2>Search Users</h2>
        <input type="text" id="search-name" placeholder="Enter name">
        <button onclick="searchUsers()">Search</button>
        <ul id="search-results"></ul>
    </div>

    <!-- Pending Friend Requests Section -->
    <div id="friend-requests">
        <h2>Pending Friend Requests</h2>
        <ul>
            {% for request in pending_requests %}
                <li>
                    {{ request.sender_id }}
                    <div>
                        <button onclick="acceptRequest({{ request.id }})">Accept</button>
                        <button onclick="rejectRequest({{ request.id }})">Reject</button>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>

    <!-- Friends List Section -->
    <div id="friends">
        <h2>Your Friends</h2>
        <ul>
            {% for friend in friends %}
                <li>{{ friend.name }} ({{ friend.global_user }})</li>
            {% endfor %}
        </ul>
    </div>

    <script>
        // const currentUserId = "{{ user.user_id }}";
        const currentUserId = "{{ etag }}";

        // Function to search users by name
        async function searchUsers() {
            const name = document.getElementById('search-name').value;
            // const response = await fetch(`/search-users/?name=${name}`);
            const response = await fetch(`/search-users/?name=${encodeURIComponent(name)}`);
            const users = await response.json();

            // const resultsList = document.getElementById('search-results');
            // resultsList.innerHTML = users.map(user => `
            //     <li>
            //         ${user.name} (${user.global_user})
            //         <button onclick="sendFriendRequest('${user.user_id}')">Send Friend Request</button>
            //     </li>
            // `).join('');
            const resultsList = document.getElementById('search-results');
            resultsList.innerHTML = '';

            users.forEach(user => {
                const listItem = document.createElement('li');
                listItem.textContent = `${user.name} (${user.global_user})`;

                const sendButton = document.createElement('button');
                sendButton.textContent = 'Send Friend Request';
                sendButton.onclick = () => sendFriendRequest(user.user_id);

                listItem.appendChild(sendButton);
                resultsList.appendChild(listItem);
            });
        }

        async function sendFriendRequest(receiverId) {
            const senderId = currentUserId; // Use the user_id injected from the server

            try {
                const response = await fetch('/send-friend-request/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sender_id: senderId,
                        receiver_id: receiverId
                    }),
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(`Friend request sent to ${receiverId}`);
                } else {
                    const error = await response.json();
                    alert(`Failed to send friend request: ${error.detail}`);
                }
            } catch (error) {
                console.error('Error sending friend request:', error);
                alert('Error sending friend request. Check console logs.');
            }
        }


        // Function to accept a friend request
        async function acceptRequest(requestId) {
            const response = await fetch(`/friend-requests/${requestId}/accept`, {
                method: 'POST',
            });

            if (response.ok) {
                alert('Friend request accepted!');
                location.reload();  // Refresh the page to update the list
            } else {
                const error = await response.json();
                alert(`Error: ${error.detail}`);
            }
        }

        // Function to reject a friend request
        async function rejectRequest(requestId) {
            const response = await fetch(`/friend-requests/${requestId}/reject`, {
                method: 'POST',
            });

            if (response.ok) {
                alert('Friend request rejected!');
                location.reload();  // Refresh the page to update the list
            } else {
                const error = await response.json();
                alert(`Error: ${error.detail}`);
            }
        }

        async function fetchFriends() {
            const response = await fetch('/api/friends/', {
                headers: {
                    'Accept': 'application/json'
                }
            });
            const friends = await response.json();
            const friendsList = document.getElementById('friends-list');
            friendsList.innerHTML = friends.map(friend => `
                <li>${friend.name} (${friend.global_user})</li>
            `).join('');
        }

        async function fetchPendingRequests() {
            const response = await fetch('/api/friends/', {
                headers: {
                    'Accept': 'application/json'
                }
            });
            const data = await response.json();
            const requestsList = document.getElementById('requests-list');
            requestsList.innerHTML = data.pending_requests.map(request => `
                <li>
                    ${request.sender_id}
                    <button onclick="acceptRequest(${request.id})">Accept</button>
                    <button onclick="rejectRequest(${request.id})">Reject</button>
                </li>
            `).join('');
        }

        // Fetch friends and pending requests when the page loads
        fetchFriends();
        fetchPendingRequests();

    </script>
</body>
</html>
