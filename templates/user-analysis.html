<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="static/icons/YT.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizations and Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 60px;
            height: 100vh;
            background-color: #1c1c1c;
            transition: width 0.3s;
            padding-top: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            position: fixed;
            left: 0;
            top: 0;
            overflow-x: hidden;
            z-index: 100;
        }

        .sidebar.expanded {
            width: 200px;
        }

        .sidebar:hover {
            width: 200px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            padding-top: 60px; /* Space for the toggle button */
        }

        .sidebar li {
            padding: 20px;
            text-align: center;
            transition: background 0.3s;
        }

        .sidebar li:hover {
            background-color: #333;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            white-space: nowrap;
        }

        .sidebar a span {
            visibility: hidden; /* Hide text when sidebar is collapsed */
        }

        .sidebar.expanded a span,
        .sidebar:hover a span {
            visibility: visible; /* Show text when sidebar is expanded or hovered */
        }

        .sidebar:hover a,
        .sidebar.expanded a {
            text-align: left;
            padding-left: 20px;
        }

        /* Toggle Button Styles */
        .toggle-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .toggle-btn:hover {
            background-color: #555;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 60px;
            width: 100%;
            padding: 30px;
            display: flex; /* Use Flexbox for layout */
            gap: 20px; /* Space between containers */
        }

        .sidebar.expanded + .main-content {
            margin-left: 200px;
        }

        /* Profile Picture Container */
        .profile-container {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            z-index: 100;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            transition: transform 0.3s;
        }

        .profile-pic:hover {
            transform: scale(1.1);
        }

        /* Dropdown Menu */
        .dropdown {
            display: none;
            position: absolute;
            top: 60px;
            right: 0;
            background-color: #333333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            width: 180px;
        }

        .dropdown a {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 12px 15px;
            border-bottom: 1px solid #444;
            transition: background-color 0.3s;
            text-align: center;
        }

        .dropdown a:last-child {
            border-bottom: none;
        }

        .dropdown a:hover {
            background-color: #555555;
        }

        .show {
            display: block;
        }

        /* Visualizations Container */
        .visualizations-container {
            flex: 1; /* Take up half the space */
            padding: 20px;
            border-radius: 12px;
            background-color: #1e1e1e;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        .visualizations-container h2 {
            color: #e6cf69; /* Gold color for headings */
            text-align: center;
        }

        .visualizations-container h3 {
            color: #e6cf69; /* Gold color for subheadings */
            margin-top: 20px;
        }

        canvas {
            max-width: 100%;
            margin: 20px auto;
            background-color:  #3a3a5a; /* Light blue background for charts */
            border-radius: 10px;
            padding: 10px;
        }

        /* Summary Container */
        .summary-container {
            flex: 1; /* Take up half the space */
            padding: 20px;
            border-radius: 12px;
            background-color: #1e1e1e;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        .summary-container h2 {
            color: #e6cf69; /* Gold color for headings */
            text-align: center;
        }

        .summary-content {
            background-color: #3a3a5a; /* Darker background for summary */
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.5;
            color: #e0e0e0; /* Light gray text */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column; /* Stack containers vertically on smaller screens */
            }

            .visualizations-container,
            .summary-container {
                flex: none; /* Reset flex for stacked layout */
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <ul>
            <!-- <li><a href="/summarize">📝 <span>Summarize</span></a></li> -->
            <li><a href="/get_recommendations">📊 <span>Home Page</span></a></li>
            <li><a href="/get-your-data">📥 <span>Sync data</span></a></li>
            <li><a href="/logout">🚪 <span>Logout</span></a></li>
        </ul>
        <!-- Toggle Button -->
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">

        <!-- Profile Picture with Dropdown -->
        <div class="profile-container" onclick="toggleDropdown()">
            <img src="{{ user['picture'] }}" alt="Profile Picture" class="profile-pic">
            <div class="dropdown" id="profile-dropdown">
                <a>{{ user['given_name'] }} {{ user['family_name'] }}</a>
                <a href="/logout">Log Out</a>
            </div>
        </div>

        <!-- Visualizations Section -->
        <div class="visualizations-container">
            <h2>YouTube Subscription Categories for {{ user['given_name'] }}</h2>

            <h3>Pie Chart - Category Distribution</h3>
            <canvas id="pieChart"></canvas>

            <h3>Bar Chart - Interest Levels</h3>
            <canvas id="barChart"></canvas>
        </div>

        <!-- Summary Section -->
        <div class="summary-container">
            <h2>Summary</h2>
            <div class="summary-content">
                {{ summary }}
            </div>
        </div>
    </div>

    <!-- JavaScript for Dropdown Toggle and Sidebar Toggle -->
    <script>
        // Toggle Dropdown
        function toggleDropdown() {
            const dropdown = document.getElementById('profile-dropdown');
            dropdown.classList.toggle('show');
        }

        // Close the dropdown if clicked outside
        window.addEventListener('click', function (event) {
            const profileContainer = document.querySelector('.profile-container');
            const dropdown = document.getElementById('profile-dropdown');
            if (!profileContainer.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        // Toggle Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('expanded');
        }

        // Render Charts
        const categoriesData = {{ categories | tojson }};
        const labels = Object.keys(categoriesData);
        const values = Object.values(categoriesData);

        function renderPieChart() {
            const ctx = document.getElementById('pieChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Category Distribution',
                        data: values,
                        backgroundColor: [
                            '#e74c3c', /* Red */
                            '#3498db', /* Blue */
                            '#f1c40f', /* Yellow */
                            '#2ecc71', /* Green */
                            '#9b59b6', /* Purple */
                            '#e67e22'  /* Orange */
                        ],
                        borderColor: '#ffffff',
                        borderWidth: 1
                    }]
                },
                options: {
                    plugins: {
                        legend: {
                            labels: {
                                color: "#ffffff"
                            }
                        }
                    }
                }
            });
        }

        function renderBarChart() {
            const ctx = document.getElementById('barChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Interest Levels',
                        data: values,
                        backgroundColor: '#1a8abece',
                        borderColor: '#ffffff',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: "#ffffff"
                            }
                        },
                        x: {
                            ticks: {
                                color: "#ffffff"
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: "#ffffff"
                            }
                        }
                    }
                }
            });
        }

        renderPieChart();
        renderBarChart();
    </script>
</body>
</html>
